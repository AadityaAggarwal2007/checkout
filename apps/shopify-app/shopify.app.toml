# Shopify app config, deployed with the Shopify CLI (`shopify app deploy`) from this folder.
# client_id and the URLs are filled in when the Partner app is created (see README.md here).
name = "Checkout"
client_id = "REPLACE_WITH_SHOPIFY_API_KEY"
application_url = "https://REPLACE_WITH_PUBLIC_URL/shopify/install"
embedded = false

[access_scopes]
scopes = "read_products,write_orders,read_orders,read_customers,write_customers,read_discounts,read_themes"

[auth]
redirect_urls = ["https://REPLACE_WITH_PUBLIC_URL/shopify/callback"]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://REPLACE_WITH_PUBLIC_URL/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://REPLACE_WITH_PUBLIC_URL/webhooks/shopify"

[pos]
embedded = false
