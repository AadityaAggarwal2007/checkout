name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkout" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://checkout:checkout@localhost:5432/checkout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/server
      - run: npm run typecheck
      - run: npm test
      - name: Storefront bundle (size budget)
        run: npm run build:storefront
      - name: Checkout page bundle (size budget)
        run: npm run build:checkout
      - name: Dashboard production build
        run: npx next build
        working-directory: apps/dashboard

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U checkout" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://checkout:checkout@localhost:5432/checkout_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  # After every green push to the working branch, the VPS copy updates itself (deploy/update.sh).
  # The key can only run that script as the `checkout` user (see deploy/install.sh).
  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/flexype-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: deploy-vps
    steps:
      - name: Update the checkout app on the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo "No VPS secrets: nothing deployed."; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 "checkout@$HOST" deploy
